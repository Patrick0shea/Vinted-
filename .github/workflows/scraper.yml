name: Scrape Vinted Deals

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests tabulate fake-useragent

    - name: Run Scraper
      run: |
        # Customize your search query here!
        python start.py "liverpool jersey" --json deals.json --hours 24
      
    - name: Commit and Push results
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update deals.json"
        file_pattern: deals.json
