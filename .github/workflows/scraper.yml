name: Scrape Vinted Deals

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours (uses defaults)
  workflow_dispatch:
    inputs:
      query:
        description: 'Search Query'
        required: true
        default: 'liverpool jersey'
      hours:
        description: 'Max Age (Hours)'
        required: false
        default: '24'
      threshold:
        description: 'Discount Threshold (e.g. 0.85)'
        required: false
        default: '0.85'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests tabulate fake-useragent

    - name: Run Scraper
      run: |
        # Use inputs from the manual trigger
        python start.py "${{ github.event.inputs.query || 'liverpool jersey' }}" --json deals.json --hours ${{ github.event.inputs.hours || 24 }} --threshold ${{ github.event.inputs.threshold || 0.85 }}
      
    - name: Commit and Push results
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update deals.json"
        file_pattern: deals.json
