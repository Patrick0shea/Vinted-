<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Deal Finder</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Vinted Deals</h1>
            <p>Live listings > 15% below median market price</p>
            <div id="status" class="status-badge">Loading deals...</div>
        </header>

        <div class="search-container">
            <input type="text" id="filterInput" placeholder="Filter results...">
        </div>

        <div id="deals-grid" class="deals-grid">
            <!-- Deals will be injected here -->
        </div>

        <footer>
            <p>Automated by GitHub Actions | <a href="https://github.com/Patrick0shea/Vinted-">View Repo</a></p>
        </footer>
    </div>

    <script>
        async function loadDeals(query = "liverpool jersey", hours = 24, threshold = 0.85) {
            const grid = document.getElementById('deals-grid');
            const status = document.getElementById('status');

            status.textContent = "Searching Vinted live...";
            status.className = 'status-badge';
            grid.innerHTML = ''; // Clear current results

            try {
                // Call our new Vercel API
                const url = `/api/search?q=${encodeURIComponent(query)}&hours=${hours}&threshold=${threshold}`;
                const response = await fetch(url);
                const deals = await response.json();

                if (deals.length === 0) {
                    status.textContent = "No deals found matching criteria.";
                    return;
                }

                status.textContent = `Found ${deals.length} active deals for "${query}"`;
                status.classList.add('success');

                deals.forEach(deal => {
                    const card = document.createElement('div');
                    card.className = 'deal-card';

                    const discount = Math.round(deal.discount_pct);
                    const age = deal.age_hours < 24 ?
                        `${deal.age_hours.toFixed(1)}h ago` :
                        `${(deal.age_hours / 24).toFixed(1)}d ago`;

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="brand">${deal.brand || 'Unknown'}</span>
                            <span class="discount-badge">-${discount}%</span>
                        </div>
                        <h3>${deal.title}</h3>
                        <div class="card-price">
                            <span class="price">${deal.price} ${deal.currency}</span>
                            <span class="age">${age}</span>
                        </div>
                        <a href="${deal.link}" target="_blank" class="view-btn">View on Vinted</a>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Error loading deals:', error);
                status.textContent = "Error connecting to Vinted API.";
            }
        }

        // Search Handlers
        const searchInput = document.getElementById('filterInput');
        searchInput.placeholder = "Search for item (e.g. Stone Island)...";

        // Add a visible search button for better UX
        const searchContainer = document.querySelector('.search-container');
        if (!document.getElementById('searchBtn')) {
            const btn = document.createElement('button');
            btn.id = 'searchBtn';
            btn.textContent = 'Search Live';
            btn.className = 'view-btn'; // Re-use style
            btn.style.display = 'inline-block';
            btn.style.marginLeft = '10px';
            btn.style.width = 'auto';
            btn.style.cursor = 'pointer';

            btn.onclick = () => {
                const q = searchInput.value || "liverpool jersey";
                loadDeals(q);
            };

            searchContainer.appendChild(btn);
        }

        // Allow Enter key
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const q = searchInput.value || "liverpool jersey";
                loadDeals(q);
            }
        });

        // Initial load
        loadDeals();
    </script>
</body>

</html>
